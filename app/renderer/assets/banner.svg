<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mentis — un asistente que vive en tu computadora">
  <title>Mentis</title>
  <desc>Banner de Mentis: asistente personal que corre en tu propia máquina.</desc>
  <defs>
    <!-- El terracota de la identidad, el mismo de la app (la variable de acento). El degradado va de un tono
         a otro del MISMO color y no a otro color: la identidad es terracota sobre negro,
         y un segundo color de acento la volvería otra cosa. -->
    <linearGradient id="terracota" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8734a"/>
      <stop offset="100%" stop-color="#e08a63"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0a0a0b"/>

  <!-- El isotipo: la M editorial de Mentis, en trazo. Se dibuja con líneas y no con una fuente
       para que el banner no dependa de que GitHub tenga instalada ninguna tipografía. -->
  <g transform="translate(96, 108)" stroke="url(#terracota)" stroke-width="7" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 144 L0 0 L56 96 L112 0 L112 144"/>
  </g>

  <text x="248" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="104"
        font-weight="700" fill="#f2efe9" letter-spacing="2">Mentis</text>

  <text x="252" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="25" fill="#a8a49d">
    Un asistente que vive en tu computadora, no en la nube de otro.
  </text>

  <!-- Las tres cosas que lo separan de un chat. Van como texto y no como íconos: en un banner de
       360px de alto, un ícono de 20px es una mancha y una palabra se lee. -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#d8734a">
    <text x="252" y="286">Ejecuta de verdad</text>
    <text x="470" y="286">·</text>
    <text x="496" y="286">Te habla y te escucha</text>
    <text x="742" y="286">·</text>
    <text x="768" y="286">Se acuerda de vos</text>
  </g>

  <!-- Seis modos: la idea central del proyecto, abajo a la derecha, en su propia linea: a la altura de las tres virtudes se pisaba
       con "Se acuerda de vos" (medido renderizando, no mirando el codigo). -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#6f6b65">
    <text x="1184" y="332" text-anchor="end">Mentis · Code · Designe · Cowork · Study · Science</text>
  </g>
</svg>
